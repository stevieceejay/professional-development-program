name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-smoke-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PORT: 4000
      SESSION_SECRET: ci-session-secret
      CI_USERNAME: e2e_ci_user
      CI_EMAIL: e2e_ci_user@example.test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflow
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed sample data
        run: npm run seed:sample

      - name: Build frontend assets
        run: npm run build

      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server health
        run: |
          for _ in {1..60}; do
            if curl -fsS "http://localhost:${PORT}/api/health" > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start in time"
          tail -n 200 server.log || true
          exit 1

      - name: Run smoke tests
        run: npm run smoke -- --port="${PORT}"

      - name: Seed CI user for E2E
        env:
          CI_PASSWORD: ${{ secrets['CI_PASSWORD'] }}
        run: |
          if [ -z "${CI_PASSWORD}" ]; then
            echo "CI_PASSWORD not set; skipping CI user seeding."
            exit 0
          fi
          node tools/create_ci_user.js

      - name: Run focused E2E
        env:
          CI_PASSWORD: ${{ secrets['CI_PASSWORD'] }}
        run: |
          if [ -z "${CI_PASSWORD}" ]; then
            echo "CI_PASSWORD not set; skipping focused E2E."
            exit 0
          fi
          node tools/e2e_focus_test.js

      - name: Show server log on failure
        if: failure()
        run: tail -n 300 server.log || true

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
