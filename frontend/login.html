<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f8; color: #333; }
    h1 { text-align: center; margin-bottom: 30px; }
    nav { background: #0078d7; padding: 10px; margin-bottom: 20px; }
    nav ul { list-style: none; display: flex; justify-content: center; gap: 20px; margin: 0; padding: 0; }
    nav a { color: white; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    .login-box { max-width: 400px; margin: 0 auto; padding: 20px; background: #fff; border: 1px solid #ccc; border-radius: 8px; }
    .login-box h2 { margin-top: 0; color: #0078d7; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; font-size: 15px; border: 1px solid #ccc; border-radius: 5px; }
    button { width: 100%; padding: 10px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; background-color: #0078d7; color: white; transition: background-color 0.3s ease; }
    button:hover { background-color: #005a9e; }
    #output { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ccc; border-radius: 5px; white-space: pre-wrap; font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <h1>Nonprofit Integration Demo</h1>

  <!-- Navigation Bar -->
  <nav>
    <ul>
      <li><a href="/login.html">Login</a></li>
      <li><a href="/index.html">Dashboard</a></li>
      <li><a href="/index.html#admin">Admin</a></li>
    </ul>
  </nav>

  <div class="login-box">
    <h2>Login</h2>
    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Enter username" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password" />
    </div>
    <button onclick="login()">Login</button>
    <div id="output">Enter credentials and click Login...</div>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        document.getElementById('output').textContent = 'Please enter both username and password.';
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);

        if (data.status === 'login route hit') {
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 1500);
        }
      } catch (err) {
        document.getElementById('output').textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
