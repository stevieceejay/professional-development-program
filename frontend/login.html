<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Program Login</title>
  <style>
    :root { --bg:#f7f7fb; --fg:#1f2937; --accent:#2563eb; --muted:#6b7280; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--fg); }
    .container { max-width:420px; margin:8vh auto; background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:28px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
    h1 { font-size:1.5rem; margin:0 0 6px; }
    .subtitle { color:var(--muted); margin:0 0 18px; }
    label { display:block; font-weight:600; margin:16px 0 6px; }
    input[type="email"], input[type="password"] { width:100%; padding:12px; border:1px solid #d1d5db; border-radius:8px; font-size:1rem; }
    .actions { display:flex; align-items:center; justify-content:space-between; margin-top:18px; }
    button { background:var(--accent); color:#fff; border:none; padding:12px 16px; border-radius:8px; font-weight:600; cursor:pointer; }
    button:hover { filter:brightness(1.05); }
    .foot { margin-top:18px; font-size:.9rem; color:var(--muted); }
    a { color:var(--accent); text-decoration:none; }
    a:focus, input:focus, button:focus { outline:3px solid rgba(37,99,235,.35); outline-offset:2px; }
  </style>
</head>
<body>
  <h2>Login</h2>
<form id="loginForm">
  <input type="text" id="username" placeholder="Username" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">Login</button>
</form>
<div id="loginResponse"></div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  const response = await fetch('http://127.0.0.1:4000/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await response.json();
  document.getElementById('loginResponse').innerText =
    `Login route hit: ${JSON.stringify(data)}`;
});
</script>
  <main class="container" role="main">
    <header>
      <h1>Human‑AI Professional Development Portal</h1>
      <p class="subtitle">Sign in to continue your 12‑week journey</p>
    </header>

    <form aria-labelledby="login-title" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <h2 id="login-title" class="visually-hidden">Login form</h2>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <div class="actions">
        <label>
          <input type="checkbox" name="remember" /> Remember me
        </label>
        <button type="submit" aria-label="Sign in">Sign in</button>
      </div>

      <p class="foot">New learner? <a href="#" aria-label="Sign up link (nonfunctional demo)">Sign up</a></p>
    </form>
  </main>

  <script>
    // Demo only: no auth; redirects to dashboard on submit.
  </script>
</body>
</html>
