<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | ARG Professional Development</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shared Header -->
  <header>
  <h1>ARG Professional Development</h1>
  <p class="tagline">Grow your skills, adapt, and thrive 🚀</p>
  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="signin.html">Sign In</a>
    <a href="signup.html">Sign Up</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<!-- Welcome banner -->
<div id="welcomeBanner" class="welcome-banner"></div>


  <!-- Main Content -->
  <main class="home-container">
    <h2>Admin Landing</h2>
    <p id="adminNotice">Checking permissions...</p>
    <div class="admin-links" style="margin-top:16px;">
      <a href="admin-dashboard.html" id="linkAdminDashboard" style="margin-right:12px;">Admin Dashboard</a>
      <a href="dashboard.html" id="linkUserDashboard">User Dashboard</a>
      <a href="admin-guide.html" id="linkAdminGuide" style="margin-left:12px;">Admin Guide</a>
    </div>
    <div id="usersOutput" style="margin-top:18px;"></div>
  </main>

  <!-- Shared Footer -->
  <footer>
    <p>&copy; 2025 ARG Professional Development</p>
  </footer>

  <script src="scripts.js"></script>
  <script>
    // Ensure only admins can stay on this page. Non-admins are redirected to user dashboard.
    (async function(){
      try{
        const res = await fetch('/api/session');
        const data = await res.json();
        const notice = document.getElementById('adminNotice');
        if (data.status === 'success' && data.data.role === 'Admin'){
          notice.textContent = `Welcome, ${data.data.username} (Admin)`;
          // Load users list for admin dashboard on this landing page
          if (document.getElementById('usersOutput')) loadUsers();
        } else if (data.status === 'success'){
          // Logged in but not admin -> redirect to user dashboard
          window.location.href = 'dashboard.html';
        } else {
          // Not logged in
          window.location.href = 'signin.html';
        }
      } catch (err){
        console.error('Session check failed:', err);
        window.location.href = 'signin.html';
      }
    })();
  </script>
</body>
</html>
