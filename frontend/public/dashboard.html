<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Demo</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f8; color: #333; }
    h1 { text-align: center; margin-bottom: 30px; }
    nav { background: #0078d7; padding: 10px; margin-bottom: 20px; }
    nav ul { list-style: none; display: flex; justify-content: center; gap: 20px; margin: 0; padding: 0; }
    nav a { color: white; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    .section { max-width: 600px; margin: 20px auto; padding: 20px; background: #fff; border: 1px solid #ccc; border-radius: 8px; }
    .section h2 { margin-top: 0; color: #0078d7; }
    .button-container { display: flex; gap: 15px; margin-top: 10px; }
    button { padding: 10px 20px; font-size: 15px; border: none; border-radius: 5px; cursor: pointer; background-color: #0078d7; color: white; transition: background-color 0.3s ease; }
    button:hover { background-color: #005a9e; }
    #output { max-width: 800px; margin: 20px auto; padding: 20px; background: #fff; border: 1px solid #ccc; border-radius: 5px; }
    #output table { width: 100%; border-collapse: collapse; }
    #output th, #output td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    #output th { background: #f0f4f8; color: #333; }
    #output tr:nth-child(even) { background-color: #f9fbfd; }
  </style>
</head>
<body>
  <h1>Nonprofit Integration Demo</h1>

  <!-- Navigation Bar -->
  <nav>
    <ul>
      <li><a href="/index.html">Home</a></li>
      <li><a href="/login.html">Login</a></li>
      <li><a href="/dashboard.html">Dashboard</a></li>
      <li><a href="/admin.html">Admin</a></li>
    </ul>
  </nav>

  <!-- Dashboard Section -->
  <div class="section">
    <h2>Dashboard</h2>
    <div class="button-container">
      <button onclick="callRoute('/api/dashboard')">View Dashboard Data</button>
    </div>
  </div>

  <!-- Output -->
  <div id="output">Click a button to see results here...</div>

  <!-- ✅ Shared script goes here -->
  <script src="/script.js"></script>
</body>
</html>
